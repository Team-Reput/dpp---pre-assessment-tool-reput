<div class="page">
  <!-- ============ Top gradient banner ============ -->
  <header class="banner">
    <div class="banner__left">
      <span class="banner__badge">{{ badgeText }}</span>

      <div class="banner__brand">
        <svg class="banner__logo" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2.5c-3.2 4.2-6 7.4-6 11a6 6 0 0 0 12 0c0-3.6-2.8-6.8-6-11Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <path
            d="M12 9.5c-1.4 1.9-2.6 3.3-2.6 4.8a2.6 2.6 0 0 0 5.2 0c0-1.5-1.2-2.9-2.6-4.8Z"
            fill="currentColor"
          />
        </svg>
        <span class="banner__name">{{ partnerName }}</span>
        <span class="banner__times" aria-hidden="true">×</span>
        <span class="banner__name">{{ brandName }}</span>
      </div>
    </div>

    <div class="banner__right" aria-hidden="true">
      @for (line of scanLabelLines; track line) {
        <span>{{ line }}</span>
      }
    </div>
  </header>

  <!-- ============ Main white card ============ -->
  <main class="card">
    <h1 class="card__title">{{ heading }}</h1>
    <p class="card__desc">{{ description }}</p>

    <!-- Video -->
    <div class="video">
      <video
        class="video__player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
        [poster]="posterSrc"
      >
        <source [src]="videoSrc" [type]="videoType" />
        @if (captionsSrc) {
          <track kind="captions" [src]="captionsSrc" srclang="en" label="English" default />
        }
        Your browser does not support the video tag.
      </video>
    </div>

    <!-- Reassurance bar -->
    <div class="note" role="note">
      <svg class="note__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.2 3.6a.6.6 0 0 1-1-.46V16h-.3A2.5 2.5 0 0 1 3 13.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M8 8.5h8M8 11.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <span>{{ reassurance }}</span>
    </div>

    <!-- Phases -->
    <ol class="phases">
      @for (phase of phases; track trackPhase($index, phase)) {
        <li class="phase" tabindex="0">
          <span class="phase__tag">Phase {{ phase.id }}</span>
          <strong class="phase__title">{{ phase.title }}</strong>
          <span class="phase__sub">{{ phase.subtitle }}</span>
        </li>
      }
    </ol>

    <!-- CTA -->
    <div class="actions">
      <button
        type="button"
        class="cta"
        [class.cta--clicked]="starting()"
        [disabled]="starting()"
        (click)="onStart()"
      >
        <span class="cta__label">{{ buttonLabel }}</span>
        <span class="cta__arrow" aria-hidden="true">→</span>
      </button>
    </div>
  </main>
</div>
