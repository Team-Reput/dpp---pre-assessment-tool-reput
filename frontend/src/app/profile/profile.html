<div class="app">
  <header class="brandbar">
    <div class="brandbar-left">
      <span class="eyebrow">{{ data.eyebrow }}</span>
      <div class="collab">
        <span class="logo-word">
          <svg class="drop" viewBox="0 0 18 22" fill="none" aria-hidden="true">
            <path d="M9 1.5C9 1.5 2 9.2 2 14.2A7 7 0 0 0 16 14.2C16 9.2 9 1.5 9 1.5Z" stroke="#fff" stroke-width="1.6"/>
            <path d="M6 15a3 3 0 0 0 3 2.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          {{ data.brandLeft }}
        </span>
        <span class="x">×</span>
        <span class="logo-word">{{ data.brandRight }}</span>
      </div>
    </div>
    <div class="brandbar-tag">DPP<br>Readiness<br>Scan</div>
  </header>

  <main class="card" id="card">
    <div class="rail" id="rail" hidden></div>
    <div class="step-meta" id="stepMeta" hidden>
      <span id="stepCounter"></span>
      <span class="step-tag" id="stepTag"></span>
    </div>
    <div class="panel" id="panel">
      <div class="screen enter">
        <h1>{{ data.heading }}</h1>
        <p class="sub">{{ data.subtitle }}</p>

        <div class="options" id="personaOpts">
          @for (o of data.personaOptions; track o.v) {
            <button
              type="button"
              class="opt"
              [class.selected]="selectedPersona === o.v"
              [attr.data-val]="o.v"
              [attr.aria-pressed]="selectedPersona === o.v"
              (click)="selectPersona(o.v)">
              <div class="ico">
                @if (o.icon === 'brand') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z"/>
                    <circle cx="7" cy="7" r="1.4"/>
                  </svg>
                } @else {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2 2 7l10 5 10-5-10-5Z"/>
                    <path d="m2 17 10 5 10-5"/>
                    <path d="m2 12 10 5 10-5"/>
                  </svg>
                }
              </div>
              <div class="opt-text">
                <div class="opt-title">{{ o.t }}</div>
                <div class="opt-desc">{{ o.d }}</div>
              </div>
              <div class="radio"></div>
            </button>
          }
        </div>

        <div style="margin-top:16px">
          <div class="assure">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="10" cy="10" r="8.25" stroke="#039297" stroke-width="1.5"/>
              <path d="M6.8 10.3 9 12.4 13.4 7.8" stroke="#039297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>{{ data.assureText }}</span>
          </div>
        </div>

        <div class="nav">
          <button type="button" class="btn btn-ghost" (click)="onBack()">← Back</button>
          <button
            type="button"
            class="btn btn-primary"
            [disabled]="!selectedPersona"
            (click)="onContinue()">
            Continue →
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
