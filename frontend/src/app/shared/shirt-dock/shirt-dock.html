<div [id]="inline ? 'heroShirtInner' : 'shirtDock'" [class.inline-host]="inline">
  <div class="shirt-box" id="shirtBox" [class.hot]="isHot()" [class.bump]="isBump()">
    <div class="shirt-spot"></div>
    <div class="shirt-label">{{ inline ? dummy.labelFinal : dummy.labelLive }}</div>
    <div
      class="shirt-persp"
      id="shirtPersp"
      #perspEl
      (pointermove)="onPointerMove($event, perspEl)"
      (pointerleave)="onPointerLeave()">
      <div
        class="shirt-tilt"
        id="shirtTilt"
        [style.--rx]="rx()"
        [style.--ry]="ry()">
        <div class="shirt-sway">
          <svg class="shirt-svg" viewBox="0 0 387 516" role="img" aria-label="A shirt that gains colour as you answer Yes">
            <defs>
              <filter id="shGray">
                <feColorMatrix type="saturate" values="0" />
                <feComponentTransfer>
                  <feFuncR type="linear" slope=".8" intercept=".16" />
                  <feFuncG type="linear" slope=".8" intercept=".16" />
                  <feFuncB type="linear" slope=".8" intercept=".16" />
                </feComponentTransfer>
              </filter>
              <mask id="shMask">
                <g class="rev" id="shRev" [style.transform]="levelTransform()">
                  <path
                    class="wave"
                    d="M0 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 L600 0 L600 700 L0 700 Z"
                    fill="#fff" />
                </g>
              </mask>
              <clipPath id="shRound">
                <rect width="387" height="516" rx="18" />
              </clipPath>
              <linearGradient id="shSheen" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".28" />
                <stop offset=".4" stop-color="#fff" stop-opacity="0" />
                <stop offset="1" stop-color="#000" stop-opacity=".18" />
              </linearGradient>
            </defs>
            <g clip-path="url(#shRound)">
              <image [attr.href]="shirtImg" width="387" height="516" filter="url(#shGray)" opacity=".55" />
              <g mask="url(#shMask)">
                <image [attr.href]="shirtImg" width="387" height="516" />
                <rect width="387" height="516" fill="#19b8dc" opacity=".16" style="mix-blend-mode:multiply" />
              </g>
              <g class="rev" id="shScan" [style.transform]="levelTransform()">
                <path
                  class="wave"
                  d="M0 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 q15 -7 30 0 t30 0 "
                  fill="none"
                  stroke="#bff6ff"
                  stroke-width="3.5"
                  stroke-linecap="round"
                  opacity=".95" />
              </g>
              <rect width="387" height="516" fill="url(#shSheen)" />
            </g>
            <rect width="387" height="516" rx="18" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3" />
          </svg>
        </div>
      </div>
    </div>
    
  </div>
</div>
